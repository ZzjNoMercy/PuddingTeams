name: Release desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require macOS signing and notarization secrets
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$MACOS_CERTIFICATE_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Build signed and notarized DMG
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm build:electron:${{ matrix.arch }}
      - run: codesign --verify --deep --strict --verbose=2 electron/release/mac*/PuddingTeams.app
      - run: spctl --assess --type execute --verbose=2 electron/release/mac*/PuddingTeams.app
      - run: xcrun stapler validate electron/release/PuddingTeams-1.0.2-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: PuddingTeams-macos-${{ matrix.arch }}
          path: electron/release/PuddingTeams-1.0.2-${{ matrix.arch }}.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.windows-signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Detect optional Windows Authenticode certificate
        id: windows-signing
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $hasLink = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)
          if ($hasLink -ne $hasPassword) {
            throw "WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD must either both be configured or both be absent"
          }
          $enabled = $hasLink -and $hasPassword
          $flavor = if ($enabled) { "signed" } else { "unsigned" }
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "flavor=$flavor" >> $env:GITHUB_OUTPUT
          if (-not $enabled) {
            Write-Warning "Windows signing secrets are absent; publishing an unsigned installer"
          }
      - name: Build Windows NSIS installer
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm build:electron:win:x64
      - name: Verify Authenticode signature
        if: steps.windows-signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature electron/release/PuddingTeams-1.0.2-x64.exe
          if ($signature.Status -ne "Valid") { throw "Invalid Authenticode signature: $($signature.Status)" }
      - name: Verify installer is unsigned as declared
        if: steps.windows-signing.outputs.enabled != 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature electron/release/PuddingTeams-1.0.2-x64.exe
          if ($signature.Status -ne "NotSigned") { throw "Expected unsigned installer, got: $($signature.Status)" }
          Write-Warning "PuddingTeams-1.0.2-x64.exe is unsigned and may trigger Unknown Publisher or SmartScreen warnings"
      - uses: actions/upload-artifact@v4
        with:
          name: PuddingTeams-windows-x64-${{ steps.windows-signing.outputs.flavor }}
          path: electron/release/PuddingTeams-1.0.2-x64.exe
          if-no-files-found: error

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Write checksums
        working-directory: artifacts
        run: sha256sum PuddingTeams-1.0.2-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
        run: |
          if [ "$WINDOWS_SIGNED" = "true" ]; then
            WINDOWS_NOTE="Windows x64 installer: Authenticode signed."
          else
            WINDOWS_NOTE="Windows x64 installer: unsigned; Windows may show Unknown Publisher or SmartScreen warnings. Verify SHA256SUMS.txt before installation."
          fi
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes "$WINDOWS_NOTE" --title "PuddingTeams 1.0.2"
